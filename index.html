<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salva Graficos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;padding-bottom:80px}
.top{position:sticky;top:0;background:#000000e6;padding:12px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #1a1a1a}
.profile{padding:20px 16px;display:flex;gap:14px}
.avatar{width:78px;height:78px;border-radius:50%;background:linear-gradient(45deg,#FF4D00,#FF9900);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:#000}
.socials{padding:0 16px 12px 16px;display:flex;gap:8px}
.socials a{flex:1;text-align:center;padding:11px;border-radius:12px;text-decoration:none;font-weight:800;font-size:13px;color:#fff}
.s-ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}
.s-fb{background:#1877F2}
.s-yt{background:#FF0000}
.btns{padding:0 16px 14px 16px;display:flex;gap:8px}
.btn{flex:1;text-align:center;padding:13px;border-radius:12px;text-decoration:none;font-weight:800;font-size:14px}
.b1{background:#fff;color:#000}.b2{background:#25D366;color:#fff}
.feed{padding:2px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px}
.feed div{aspect-ratio:1;background:#111}
.feed img{width:100%;height:100%;object-fit:cover}
